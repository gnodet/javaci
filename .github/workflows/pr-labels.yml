name: PR Labels

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  pr-labels:
    # Point at the feature branch in the fork while the upstream PR is pending review.
    # Switch to apache/maven-gh-actions-shared/.github/workflows/pr-labels.yml@v5
    # once https://github.com/apache/maven-gh-actions-shared/pull/346 is merged.
    uses: gnodet/maven-gh-actions-shared/.github/workflows/pr-labels.yml@main
    secrets:
      LLMAO_TOKEN: ${{ secrets.LLMAO_TOKEN }}
